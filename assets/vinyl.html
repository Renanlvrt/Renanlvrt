<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .album-container {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        /* VINYL RECORD */
        .vinyl-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, transparent 18%, #0a0a0a 18.5%),
                repeating-radial-gradient(circle at center,
                    #1a1a1a 0px,
                    #1a1a1a 1px,
                    #0f0f0f 1px,
                    #0f0f0f 3px);
            box-shadow:
                0 0 0 6px #080808,
                0 0 60px rgba(0, 217, 255, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 80px rgba(0, 0, 0, 0.8);
            animation: spin 6s linear infinite;
            position: relative;
        }

        /* Vinyl shine effect */
        .vinyl::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08) 0%,
                    transparent 40%,
                    transparent 60%,
                    rgba(255, 255, 255, 0.03) 100%);
        }

        /* Center label */
        .vinyl-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00D9FF 0%, #0a4f5c 40%, #003d47 100%);
            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(0, 217, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: counter-spin 6s linear infinite;
        }

        /* Center hole */
        .vinyl-hole {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0d1117;
            z-index: 10;
        }

        .label-year {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: -5px;
        }

        .label-text {
            font-size: 7px;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 10px;
        }

        /* ALBUM INFO SIDE */
        .album-info {
            color: white;
            max-width: 320px;
        }

        .album-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 52px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00D9FF, #00FF88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            line-height: 1;
        }

        .album-artist {
            font-size: 18px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        .album-quote {
            font-size: 14px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.5);
            border-left: 3px solid #00D9FF;
            padding-left: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .tracklist-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #00D9FF;
            margin-bottom: 15px;
        }

        .tracklist {
            list-style: none;
        }

        .tracklist li {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .tracklist li:hover {
            color: #00D9FF;
        }

        .track-num {
            width: 25px;
            font-weight: 600;
            color: #00D9FF;
        }

        .track-name {
            flex: 1;
        }

        .track-duration {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }

        .now-playing {
            margin-top: 25px;
            padding: 12px 20px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #00D9FF;
        }

        .now-playing .dot {
            width: 8px;
            height: 8px;
            background: #00FF88;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes counter-spin {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(-360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
    </style>
</head>

<body>
    <div class="album-container">
        <!-- VINYL RECORD -->
        <div class="vinyl-wrapper">
            <div class="vinyl">
                <div class="vinyl-label">
                    <div class="label-year">2028</div>
                    <div class="label-text">Durham University<br />First Class Honours</div>
                </div>
                <div class="vinyl-hole"></div>
            </div>
        </div>

        <!-- ALBUM INFO -->
        <div class="album-info">
            <div class="album-title">THE B-SIDES</div>
            <div class="album-artist">by Renan Lavirotte</div>

            <div class="album-quote">
                "Behind every achievement<br />is unseen hard work"
            </div>

            <div class="tracklist-title">▶ Tracklist</div>
            <ul class="tracklist">
                <li>
                    <span class="track-num">01</span>
                    <span class="track-name">Versailles to Durham</span>
                    <span class="track-duration">🇫🇷→🇬🇧</span>
                </li>
                <li>
                    <span class="track-num">02</span>
                    <span class="track-name">First Class Honours</span>
                    <span class="track-duration">79%</span>
                </li>
                <li>
                    <span class="track-num">03</span>
                    <span class="track-name">Captain's Log</span>
                    <span class="track-duration">🏃</span>
                </li>
                <li>
                    <span class="track-num">04</span>
                    <span class="track-name">The Robot Whisperer</span>
                    <span class="track-duration">🤖</span>
                </li>
                <li>
                    <span class="track-num">05</span>
                    <span class="track-name">Trilingual Dreams</span>
                    <span class="track-duration">🇫🇷🇯🇵🇬🇧</span>
                </li>
            </ul>

            <div class="now-playing">
                <span class="dot"></span>
                Now Playing: Life
            </div>
        </div>
    </div>
</body>

</html>
