<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style>
      .vinyl-disc {
        transform-origin: 350px 150px;
        animation: spin 8s linear infinite;
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .text-main { font-family: 'Segoe UI', Arial, sans-serif; }
      .fact-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: rgba(255,255,255,0.85); }
      .fact-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9px; fill: #00D9FF; letter-spacing: 1px; }
    </style>
    
    <!-- Premium gradient for label -->
    <linearGradient id="labelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="40%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>
    
    <!-- Vinyl shine -->
    <linearGradient id="vinylShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="320" fill="#0d1117"/>
  
  <!-- LEFT SIDE FACTS -->
  <g transform="translate(30, 70)">
    <text x="0" y="0" class="fact-label">MARATHON</text>
    <text x="0" y="18" class="fact-text">Copenhagen Finisher</text>
    
    <text x="0" y="60" class="fact-label">LANGUAGES</text>
    <text x="0" y="78" class="fact-text">French · English · Japanese</text>
  </g>
  
  <!-- Spinning vinyl group - CENTERED -->
  <g class="vinyl-disc">
    <!-- Outer vinyl base -->
    <circle cx="350" cy="150" r="115" fill="#080808"/>
    
    <!-- Grooves -->
    <circle cx="350" cy="150" r="110" fill="none" stroke="#111" stroke-width="0.6"/>
    <circle cx="350" cy="150" r="103" fill="none" stroke="#161616" stroke-width="0.5"/>
    <circle cx="350" cy="150" r="96" fill="none" stroke="#111" stroke-width="0.6"/>
    <circle cx="350" cy="150" r="89" fill="none" stroke="#161616" stroke-width="0.5"/>
    <circle cx="350" cy="150" r="82" fill="none" stroke="#111" stroke-width="0.6"/>
    <circle cx="350" cy="150" r="75" fill="none" stroke="#161616" stroke-width="0.5"/>
    <circle cx="350" cy="150" r="68" fill="none" stroke="#111" stroke-width="0.6"/>
    <circle cx="350" cy="150" r="61" fill="none" stroke="#161616" stroke-width="0.5"/>
    <circle cx="350" cy="150" r="54" fill="none" stroke="#111" stroke-width="0.6"/>
    
    <!-- Vinyl shine overlay -->
    <circle cx="350" cy="150" r="115" fill="url(#vinylShine)"/>
    
    <!-- Center label background -->
    <circle cx="350" cy="150" r="42" fill="url(#labelGradient)"/>
    <circle cx="350" cy="150" r="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
    
    <!-- Center hole -->
    <circle cx="350" cy="150" r="4" fill="#0d1117"/>
  </g>
  
  <!-- Static center text -->
  <text x="350" y="143" class="text-main" font-size="18" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">2028</text>
  <text x="350" y="160" class="text-main" font-size="6" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="0.5">PART OF THE ADVENTURE</text>
  
  <!-- RIGHT SIDE FACTS -->
  <g transform="translate(530, 70)">
    <text x="0" y="0" class="fact-label">CREATIVE</text>
    <text x="0" y="18" class="fact-text">Digital Designer</text>
    
    <text x="0" y="60" class="fact-label">LEADERSHIP</text>
    <text x="0" y="78" class="fact-text">Team Captain</text>
  </g>
  
  <!-- Album info below vinyl -->
  <g transform="translate(350, 240)">
    <text x="0" y="0" class="text-main" font-size="24" font-weight="700" fill="#00D9FF" text-anchor="middle" filter="url(#glow)">IN PROGRESS</text>
    <text x="0" y="20" class="text-main" font-size="11" font-weight="300" fill="rgba(255,255,255,0.6)" text-anchor="middle">by Renan Lavirotte</text>
    <text x="0" y="40" class="text-main" font-size="9" font-style="italic" fill="rgba(255,255,255,0.4)" text-anchor="middle">"Every step counts"</text>
  </g>
  
  <!-- Now playing indicator -->
  <g transform="translate(305, 300)">
    <circle cx="0" cy="0" r="4" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" class="text-main" font-size="9" font-weight="500" fill="#00D9FF">Now Playing</text>
  </g>
</svg>
